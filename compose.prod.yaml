services:
  frontend:
    build:
      context: ./frontend-astro
      dockerfile: Dockerfile.prod
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    command: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
    environment:
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
