services:
  frontend:
    build:
      context: ./frontend-astro
      dockerfile: Dockerfile.dev
    ports:
      - "127.0.0.1:4321:4321"
    environment:
      BACKEND_URL: http://backend:8000
    volumes:
      - ./frontend-astro:/app
      - frontend_node_modules:/app/node_modules
    tmpfs:
      - /app/.astro
    depends_on:
      - backend

  backend:
    environment:
      DEBUG: "True"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    command: >
      python manage.py runserver 0.0.0.0:8000

volumes:
  frontend_node_modules:
